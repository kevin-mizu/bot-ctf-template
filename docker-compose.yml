services:
  bot:
    build: .
    ports:
      - "55555:55555"
    environment:
      # - ENVIRONMENT=development
    restart: unless-stopped
    read_only: true
    cap_drop:
      - all
    cap_add:
      - CAP_SETGID # Needed for su-exec
      - CAP_SETUID # Needed for su-exec
    tmpfs:
      - /tmp:mode=1733,exec
